plugins {
    id 'java'
    id 'application'
}

group = project.group
version = project.version

// ---------------------------------------------------------------------------
// Local dependency jars (flat dirs + explicit files, configured via
// gradle.properties so they can be overridden without editing this file).
// ---------------------------------------------------------------------------
def forgeDir = project.hasProperty('forgeDir') ? project.forgeDir : '/root/forge-smp'
def layercloudDir = project.hasProperty('layercloudDir') ? project.layercloudDir : "${rootDir.parent}/layercloud-smp-src"
def modsDir = project.hasProperty('modsDir') ? project.modsDir : "${forgeDir}/mods"
def mcSrgJar = project.hasProperty('mcSrgJar') ? project.mcSrgJar : "${layercloudDir}/srg_gen/mc-srg.jar"

def mcSrgFile = file(mcSrgJar)
def ocFile = file("${modsDir}/OpenComputers-1.12.70-GTNH.jar")
def lwjglFile = file("${forgeDir}/lwjgl3ify-forgePatches.jar")
def guavaFile = file("${forgeDir}/libraries/com/google/guava/guava/17.0/guava-17.0.jar")

// Resolve compile classpath:
//  1. mc-srg.jar if present (obfuscated Forge 1.7.10 runtime classes)
//  2. otherwise forge universal jar
def forgeUniversal = file("${forgeDir}/forge-1.7.10-10.13.4.1614-1.7.10-universal.jar")



repositories {
    mavenCentral()
}

dependencies {
    // NOTE: compileOnly files(...) must NOT have a { } closure in Gradle 8.14 (it parses as a task/action and the files are dropped, causing 'package net.minecraft does not exist').
    compileOnly files(mcSrgFile.exists() ? mcSrgFile : forgeUniversal, ocFile, lwjglFile, guavaFile)
    // Lombok is compile-time only: no Lombok classes are bundled into the mod jar.
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testImplementation 'junit:junit:4.13.2'
}

// ---------------------------------------------------------------------------
// Java toolchain / compilation
// ---------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The original build.sh uses GraalVM JDK 25 with --release 8.
// Keep that behaviour: compile with release 8 on the running JVM so the
// output stays compatible with the Forge 1.7.10 / Java 8 runtime.
compileJava {
    options.encoding = 'UTF-8'
    options.release = 8
    options.compilerArgs = ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror', '-Xlint:-options']
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// ---------------------------------------------------------------------------
// Validation (kept from the old monolithic build.gradle / validate-all.sh)
// ---------------------------------------------------------------------------
tasks.register('validate') {
    description = 'Modular line-limit, package structure, JS syntax, and live HTTP checks'
    inputs.files(sourceSets.main.java.srcDirs.collect { fileTree(dir: it, include: '**/*.java') })
    inputs.files(fileTree(dir: 'src/main/resources', include: '**/*.mjs'))
    outputs.files(layout.buildDirectory.file('validate.done'))

    doLast {
        def failures = []
        def tmp = layout.buildDirectory.file('validate.done')
        tmp.get().asFile.parentFile.mkdirs()

        // 1) Java line limit / package
        def javaFiles = fileTree(dir: 'src/main/java', include: '**/*.java')
        javaFiles.each { f ->
            def rel = file('src/main/java').toPath().relativize(f.toPath())
            def lines = f.readLines().size()
            def limit = 696
            if (lines > limit) {
                failures << "FAIL: ${rel} exceeds modular line limit (${lines} > ${limit})"
            }

            // package-directory check
            def declared = f.readLines().find { it.startsWith('package ') }?.replace('package ', '').replace(';', '')?.trim()
            def srcRoot = project.projectDir.toPath().resolve('src/main/java')
            def expectedPkg = srcRoot.relativize(new File(f.parent).toPath())
            def dirPkg = expectedPkg.toString().replace(File.separator, '.')
            if (declared != dirPkg) {
                failures << "FAIL: Package mismatch in ${rel}: expected ${dirPkg}, got ${declared}"
            }
        }

        // 2) JS --check
        fileTree(dir: 'src/main/resources', include: '**/*.mjs').each { f ->
            def proc = ['/usr/local/bin/node', '--check', f.path].execute()
            proc.waitFor()
            if (proc.exitValue() != 0) failures << "FAIL: JS syntax ${f.path}"
        }
        tmp.get().asFile.text = 'done'
        if (!failures.isEmpty()) {
            failures.each { println it }
            throw new GradleException("validate failed: ${failures.size()} error(s)")
        }
        println 'ALL VALIDATED!'
    }
}

// ---------------------------------------------------------------------------
// Packaging
// ---------------------------------------------------------------------------
tasks.named('jar') {
    archiveFileName = 'CortexDrone-1.0.0.jar'
    // plain jar (no shadow) — matches build.sh output to mods/
    // The manifest is minimal; mcmod.info lives in src/main/resources already.
    manifest {
        attributes 'Implementation-Title'   : 'CortexDrone',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : 'LayerCloud'
    }
}

tasks.register('buildJar', Copy) {
    description = 'Build jar (plain, no-shadow) — copy of the default jar task output'
    dependsOn 'jar'
    from tasks.named('jar').get().archiveFile
    into layout.buildDirectory.file('libs')
}

tasks.register('deploy') {
    description = 'Deploy built jar to the configured mods dir'
    dependsOn 'jar'
    doLast {
        def outJar = tasks.named('jar').get().archiveFile.get().asFile
        copy {
            from outJar
            into file(modsDir)
        }
        println "Deployed ${file(modsDir)}/${outJar.name}"
    }
}

tasks.named('build') {
    dependsOn 'validate', 'deploy'
}
