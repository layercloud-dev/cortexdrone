import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

// ---------------------------------------------------------------------------
// Project metadata
// ---------------------------------------------------------------------------
group = project.findProperty('group') ?: 'ir.layercloud'
version = project.findProperty('version') ?: '1.4.0'
base {
    archivesName = 'CortexDrone'
}

// No deployment-specific default: a plain `./gradlew build` must not write
// into someone else's server directory. Pass -PmodsDir=/path/to/mods (the
// `build.sh` wrapper and gradle.properties set it for this server).
def modsDir = project.findProperty('modsDir') ?: "${buildDir}/mods"
def ocVersion = project.findProperty('ocVersion') ?: '1.12.70-GTNH'

// ---------------------------------------------------------------------------
// Java / Forge toolchain
// ---------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.7.10'
    username = 'Developer'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '12'
}

repositories {
    maven {
        name = 'GTNH Maven'
        url = uri('https://nexus.gtnewhorizons.com/repository/public/')
    }
    mavenCentral()
}

dependencies {
    // OpenComputers is the host API. The Maven dev artifact is deobfuscated by
    // RFG so its MC references match the MCP development workspace.
    //noinspection DependencyNotationArgument,GrUnresolvedAccess
    compileOnly(rfg.deobf("com.github.GTNewHorizons:OpenComputers:${ocVersion}")) {
        transitive = false
    }
    compileOnly 'org.scala-lang:scala-library:2.11.1'
    compileOnly 'com.google.guava:guava:17.0'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // In-process JavaScript engine. Rhino 1.7.15 is the newest release that is
    // still Java 8 bytecode (required by the 1.7.10 class loader); the harness
    // runs it inside the JVM instead of spawning Node.js.
    implementation 'org.mozilla:rhino:1.7.15'

    testImplementation 'junit:junit:4.13.2'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs = ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror', '-Xlint:-options']
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

compileTestJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

configurations {
    shade
}

dependencies {
    shade 'org.mozilla:rhino:1.7.15'
}

jar {
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    manifest {
        attributes 'Implementation-Title'   : 'CortexDrone',
                    'Implementation-Version': project.version,
                    'Implementation-Vendor' : 'LayerCloud'
    }
}

// ---------------------------------------------------------------------------
// Validation (line limits, package layout)
// ---------------------------------------------------------------------------
tasks.register('validate') {
    description = 'Modular line-limit and package-structure validation'
    inputs.files(sourceSets.main.java.srcDirs.collect { fileTree(dir: it, include: '**/*.java') })
    outputs.files(layout.buildDirectory.file('validate.done'))

    doLast {
        def failures = []
        def tmp = layout.buildDirectory.file('validate.done')
        tmp.get().asFile.parentFile.mkdirs()

        fileTree(dir: 'src/main/java', include: '**/*.java').each { f ->
            def rel = file('src/main/java').toPath().relativize(f.toPath())
            def lines = f.readLines().size()
            // 400 is a real ceiling, not a target: the largest file is 391 and
            // the p90 is ~253. The gate is deliberately tight so a class cannot
            // silently grow back into a monolith (the old 696 cap was calibrated
            // to exactly fit the largest class, which is why it never forced a
            // split).
            if (lines > 400) {
                failures << "FAIL: ${rel} exceeds modular line limit (${lines} > 400)"
            }

            def declared = f.readLines().find { it.startsWith('package ') }?.replace('package ', '')?.replace(';', '')?.trim()
            def expectedPkg = project.projectDir.toPath().resolve('src/main/java').relativize(new File(f.parent).toPath())
            def dirPkg = expectedPkg.toString().replace(File.separator, '.')
            if (declared != dirPkg) {
                failures << "FAIL: Package mismatch in ${rel}: expected ${dirPkg}, got ${declared}"
            }
        }

        // JavaScript syntax is validated by JsSourceTest / JsEngineTest on the
        // embedded Rhino engine, so the build no longer depends on Node.js.

        tmp.get().asFile.text = 'done'
        if (!failures.isEmpty()) {
            failures.each { println it }
            //noinspection Annotator
            throw new GradleException("validate failed: ${failures.size()} error(s)")
        }
        println 'ALL VALIDATED!'
    }
}

// ---------------------------------------------------------------------------
// Packaging / deployment
// ---------------------------------------------------------------------------
def reobfJar = tasks.named('reobfJar')

tasks.register('deploy') {
    description = 'Reobfuscate and deploy the built jar to the configured mods dir'
    dependsOn reobfJar
    doLast {
        //noinspection GrUnresolvedAccess
        def outJar = reobfJar.get().archiveFile.get().asFile
        def targetDir = file(modsDir)
        targetDir.mkdirs()
        def targetJar = new File(targetDir, outJar.name)

        // Copy to a temp file and atomically rename it over the target. A live
        // Minecraft server keeps the mod jar open through JarFile; overwriting
        // that file in place corrupts its zip offsets ("ZipFile invalid LOC
        // header" / empty class bytes -> NoClassDefFoundError crashes). An
        // atomic move swaps the directory entry and leaves the old inode
        // readable by the running server, so the next restart loads the new jar.
        def tempJar = new File(targetDir, outJar.name + '.tmp')
        Files.copy(outJar.toPath(), tempJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        try {
            Files.move(tempJar.toPath(), targetJar.toPath(),
                    StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(tempJar.toPath(), targetJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }

        // Retire older versions after the new jar is in place. Deleting a file
        // that a running JVM still has open is safe on Linux (the inode stays
        // alive); overwriting it in place is what breaks class loading.
        targetDir.listFiles()?.each { f ->
            if (f.isFile() && f.name.startsWith('CortexDrone-') && f.name.endsWith('.jar')
                && f.name != targetJar.name) {
                f.delete()
            }
        }
        println "Deployed ${targetJar}"
    }
}

tasks.named('build') {
    dependsOn 'validate', 'deploy'
}
