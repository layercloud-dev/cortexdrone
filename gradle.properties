# CortexDrone - Forge 1.7.10 Mod build configuration
# Override any of these on the command line, e.g.
#   ./gradlew build -PmodsDir=/path/to/mods

group = ir.layercloud
version = 2.5.0

# Deployed mods folder (deploy task target).
#
# Deliberately NOT set here: a committed absolute path would make a plain
# `./gradlew build` write into one developer's server directory. Pass it
# explicitly when deploying:
#   ./gradlew deploy -PmodsDir=/path/to/mods

# OpenComputers version used for the compile-only host API
ocVersion = 1.12.70-GTNH
