# CortexDrone - Forge 1.7.10 Mod build configuration
# Override any of these on the command line: ./gradlew build -PforgeDir=/path/to/forge-smp
# or via ~/.gradle/gradle.properties

group = ir.layercloud
version = 1.3.0
archivesBaseName = CortexDrone

# Directory containing forge-1.7.10-*-universal.jar, mods/, libraries/, etc.
forgeDir = /root/forge-smp
# Directory of the LayerCloud SMP server sources (srg_gen/mc-srg.jar)
layercloudDir = /root/forge-smp/layercloud-smp-src

# Path to the deployed mods folder (deploy task target)
modsDir = /root/forge-smp/mods

# mc-srg.jar is used for compile classpath. It exists in layercloud-smp-src/srg_gen/.
# If missing, compile against forge universal jar instead.
mcSrgJar = /root/forge-smp/layercloud-smp-src/srg_gen/mc-srg.jar

# Gradle 8.14's Groovy runtime cannot scan GraalVM 25 class files (major 69).
# Run the Gradle daemon on the Java 21 toolchain used for compilation.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
